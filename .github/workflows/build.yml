name: Build VOT Browser

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: 35.0.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Youtube flavor (VOT)
        run: ./gradlew assembleYoutubeDebug --stacktrace

      - name: Build Full flavor
        run: ./gradlew assembleFullDebug --stacktrace

      - name: Upload Youtube APK
        uses: actions/upload-artifact@v4
        with:
          name: app-youtube-debug
          path: app/build/outputs/apk/youtube/debug/*.apk

      - name: Upload Full APK
        uses: actions/upload-artifact@v4
        with:
          name: app-full-debug
          path: app/build/outputs/apk/full/debug/*.apk
